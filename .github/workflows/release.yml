name: Build & Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      force_release:
        description: "Create or update GitHub Release even if tag already exists"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Check Version & Tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      should_release: ${{ steps.meta.outputs.should_release }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine release metadata
        id: meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')

          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
            VERSION="${TAG#v}"
            SHOULD_RELEASE="true"
          else
            TAG="v${VERSION}"
            TAG_EXISTS=false
            set +e
            git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1
            LS_RC=$?
            set -e
            if [ "${LS_RC}" -eq 0 ]; then
              TAG_EXISTS=true
            elif [ "${LS_RC}" -ne 2 ]; then
              echo "Error: git ls-remote failed with exit code ${LS_RC}" >&2
              exit "${LS_RC}"
            fi

            RELEASE_EXISTS=false
            if gh release view "${TAG}" >/dev/null 2>&1; then
              RELEASE_EXISTS=true
            fi

            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              if [ "${{ inputs.force_release }}" = "true" ] || [ "${TAG_EXISTS}" = "false" ] || [ "${RELEASE_EXISTS}" = "false" ]; then
                SHOULD_RELEASE="true"
              else
                SHOULD_RELEASE="false"
              fi
            else
              if [ "${TAG_EXISTS}" = "false" ]; then
                SHOULD_RELEASE="true"
              else
                SHOULD_RELEASE="false"
              fi
            fi
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "should_release=${SHOULD_RELEASE}" >> "$GITHUB_OUTPUT"
          echo "Resolved version=${VERSION}, tag=${TAG}, should_release=${SHOULD_RELEASE}"

  check:
    name: Test & Clippy (Fedora 44)
    runs-on: ubuntu-latest
    container: quay.io/fedora/fedora:44
    steps:
      - name: Install build dependencies
        run: |
          dnf -y install --setopt=install_weak_deps=False \
            gcc pkgconf-pkg-config \
            gtk4-devel libadwaita-devel gtk4-layer-shell-devel dbus-devel \
            git curl ca-certificates

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | \
            sh -s -- -y --profile minimal --default-toolchain stable --component clippy
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run unit tests
        run: cargo test --locked

      - name: Run Clippy
        run: cargo clippy --all-targets --locked

  build-rpm:
    name: Build RPM (Fedora 44)
    needs: [prepare, check]
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    container: quay.io/fedora/fedora:44
    steps:
      - name: Install build dependencies
        run: |
          dnf -y install --setopt=install_weak_deps=False \
            gcc pkgconf-pkg-config \
            gtk4-devel libadwaita-devel gtk4-layer-shell-devel dbus-devel \
            binutils git curl ca-certificates

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | \
            sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-generate-rpm
        run: cargo install --locked cargo-generate-rpm

      - name: Build release binary
        run: |
          cargo build --release --locked
          strip -s target/release/ayuz

      - name: Generate RPM package
        env:
          PKG_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          RPM_VERSION="${PKG_VERSION//-/+}"
          cargo generate-rpm -s "version = \"${RPM_VERSION}\""
          ls -la target/generate-rpm/

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-rpm
          path: target/generate-rpm/*.rpm
          if-no-files-found: error

  build-deb:
    name: Build DEB (Ubuntu 26.04)
    needs: [prepare, check]
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    steps:
      - name: Install build dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libgtk-4-dev libadwaita-1-dev libgtk4-layer-shell-dev libdbus-1-dev \
            dpkg-dev git curl ca-certificates

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | \
            sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-deb
        run: cargo install --locked cargo-deb

      - name: Build release binary
        run: cargo build --release --locked

      - name: Generate DEB package
        env:
          PKG_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          DEB_VERSION="${PKG_VERSION//-/+}-1"
          cargo deb --no-build --deb-version "${DEB_VERSION}"
          ls -la target/debian/

      - name: Upload DEB artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-deb
          path: target/debian/*.deb
          if-no-files-found: error

  build-appimage:
    name: Build AppImage (Ubuntu 26.04)
    needs: [prepare, check]
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    steps:
      - name: Install build dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libgtk-4-dev libadwaita-1-dev libgtk4-layer-shell-dev libdbus-1-dev \
            file desktop-file-utils git curl ca-certificates

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | \
            sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-appimage and appimagetool
        run: |
          cargo install cargo-appimage
          curl -fL -o /tmp/appimagetool.AppImage \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /tmp/appimagetool.AppImage
          (cd /tmp && ./appimagetool.AppImage --appimage-extract)
          rm -rf /opt/appimagetool
          mv /tmp/squashfs-root /opt/appimagetool
          printf '#!/bin/sh\nexec /opt/appimagetool/AppRun "$@"\n' > /usr/local/bin/appimagetool
          chmod +x /usr/local/bin/appimagetool
          rm -f /tmp/appimagetool.AppImage

      - name: Build AppImage
        env:
          PKG_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          cargo build --release --locked
          VERSION="${PKG_VERSION}" ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 cargo appimage
          mkdir -p dist-appimage
          APPIMAGE_FILE=""
          if [ -d target/appimage ]; then
            APPIMAGE_FILE=$(find target/appimage -maxdepth 1 -name "*.AppImage" -type f | head -n 1)
          fi
          if [ -z "${APPIMAGE_FILE}" ]; then
            APPIMAGE_FILE=$(find . -maxdepth 1 -name "*.AppImage" -type f | head -n 1)
          fi
          if [ -z "${APPIMAGE_FILE}" ]; then
            echo "Error: AppImage file was not produced." >&2
            exit 1
          fi
          cp "${APPIMAGE_FILE}" "dist-appimage/ayuz-${PKG_VERSION}-x86_64.AppImage"
          chmod +x "dist-appimage/ayuz-${PKG_VERSION}-x86_64.AppImage"
          ls -la dist-appimage/

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-appimage
          path: dist-appimage/*.AppImage
          if-no-files-found: error

  release:
    name: Create Tag & GitHub Release
    needs: [prepare, check, build-rpm, build-deb, build-appimage]
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download built packages
        uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: release-assets
          merge-multiple: true

      - name: List release assets
        run: ls -la release-assets/

      - name: Create tag and GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Ayuz ${{ needs.prepare.outputs.tag }}
          generate_release_notes: true
          prerelease: false
          files: |
            release-assets/*.rpm
            release-assets/*.deb
            release-assets/*.AppImage
